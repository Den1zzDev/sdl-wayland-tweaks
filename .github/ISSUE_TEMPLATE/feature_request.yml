name: Feature request
description: Suggest an idea or enhancement for SDL Wayland Tweaks
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Have an idea or Wayland protocol feature request? Tell us about it!
  - type: textarea
    id: suggestion
    attributes:
      label: Feature Description
      description: What feature or improvement would you like to see?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case & Motivation
      description: Why would this be useful for Linux/Wayland Minecraft players?
    validations:
      required: true
