name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build Mod Jar
        run: ./gradlew assemble --no-daemon

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdl-wayland-tweaks-jar
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: sdl-wayland-tweaks-jar
          path: release-artifacts/

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --json body -q .body > release-notes.md 2>/dev/null || true
          if [ ! -s release-notes.md ]; then
            echo "Release ${{ github.ref_name }}: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" > release-notes.md
          fi

      - name: Publish to Modrinth
        if: secrets.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: sdl-wayland-tweaks
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release-artifacts/*.jar
          name: "SDL Wayland Tweaks ${{ github.ref_name }}"
          version: ${{ github.ref_name }}
          version-type: release
          changelog-file: release-notes.md
          loaders: |
            fabric
          game-versions: |
            26.3
          dependencies: |
            fabric-api(required)
            modmenu(optional)
